
spring:
  application:
    name: Smart_WMS

  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db?currentSchema=inventory, master, public
    username: postgres
    password: datnguyen@161027
    driver-class-name: org.postgresql.Driver

  flyway:
    create-schema: true
    default-schema: master
    schemas: inventory,master,public
    repair-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 3
    validate-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

